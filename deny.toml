# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Run locally: cargo deny check licenses advisories sources

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
ignore = [
    # smartstring (RUSTSEC-2026-0249): unmaintained (repo archived upstream
    # 2026-05-03), with no patched version and no maintained fork to migrate to.
    # It is transitive, never named by devbox code: dogwood-language mandates
    # rhai (features decimal,sync) for its sandboxed information-provider
    # evaluator, and rhai pulls smartstring. There is no safe upgrade or dedupe
    # (1.0.1 is the affected line and all versions are affected), so the fix must
    # come from rhai dropping smartstring upstream. Reinstating the Dogwood
    # policy LANGUAGE is a deliberate product requirement, so this transitive
    # unmaintained advisory is ignored rather than dropping dogwood-language.
    "RUSTSEC-2026-0249",
    # pin-utils (RUSTSEC-2026-0441): unmaintained. Pre-existing and transitive —
    # it is pulled in only via the AWS SDK (aws-smithy-http -> aws-config / the
    # aws-sdk-* crates), not by any devbox code. 0.1.0 is the only published
    # version, so there is no safe upgrade or dedupe; the fix must come from the
    # upstream AWS SDK dropping it. This is the sole remaining advisory after the
    # dependency bumps (FEAT-001) and the dogwood removal (FEAT-002), both of
    # which fixed their advisories at the source rather than ignoring them.
    "RUSTSEC-2026-0441",
    # libsqlite3-sys (RUSTSEC-2026-0459, CVE-2026-119375): bundled SQLite before
    # 3.54.0 can return uninitialized page-cache memory when it opens a database
    # with a crafted sibling -wal file of a different page size. Transitive via
    # sqlx-sqlite 0.9.0 -> sqlx -> devbox-server. The fix is libsqlite3-sys 0.39,
    # but sqlx-sqlite 0.9.0 (latest) requires <0.38, so there is no upgrade path
    # yet. Exposure is local-only: an attacker must supply both the database and
    # its -wal file. Production uses Aurora DSQL; SQLite opens only the server's
    # own dev/test databases. Remove once sqlx ships on libsqlite3-sys >=0.39.
    "RUSTSEC-2026-0459",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
